<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    CSP 说明：
    - 开发模式（Vite HMR）：需要 connect-src ws://localhost:* 以支持热更新
    - 打包模式：仅 'self' 即可
    打包后的 dist/index.html 由 Vite 构建时自动处理 CSP。
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:* http://localhost:*;">
  <title>Seek Agent</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
