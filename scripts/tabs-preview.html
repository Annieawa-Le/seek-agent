<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>标题栏标签页预览</title>
<style>
  :root {
    --bg-base: #141110;
    --bg-deepest: #0d0b0a;
    --text-primary: #f3efe6;
    --text-muted: #a89f92;
    --text-dim: #6f675c;
    --border-subtle: rgba(255, 255, 255, 0.06);
    --gold-300: #E5D08A;
    --gold-400: #D4B86A;
    --danger: #ef4444;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
    --header-height: 48px;
    --font-mono: 'Cascadia Code', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: var(--bg-deepest); color: var(--text-primary); }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--header-height);
    padding: 0 var(--space-4);
    background: rgba(21, 18, 16, 0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
    position: relative;
  }
  #header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 168, 67, 0.25), transparent);
  }
  .header-left { display: flex; align-items: center; gap: 4px; }
  .header-right { display: flex; align-items: center; gap: var(--space-3); }

  .header-center {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 var(--space-2);
  }

  .header-tabs {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 760px;
    overflow: hidden;
  }
  .header-tabs-scroll {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    flex: 1;
  }
  .header-tabs-scroll::-webkit-scrollbar { display: none; }
  .header-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 8px 0 12px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    max-width: 200px;
    min-width: 60px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .header-tab:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
  .header-tab.active {
    background: rgba(212, 168, 67, 0.12);
    border-color: rgba(212, 168, 67, 0.35);
    color: var(--gold-300);
  }
  .header-tab-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-tab-close {
    display: flex; align-items: center; justify-content: center;
    width: 16px; height: 16px;
    border: none; border-radius: 4px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: background 0.12s, color 0.12s;
  }
  .header-tab-close:hover { background: rgba(239, 68, 68, 0.18); color: var(--danger); }
  .header-tab-new {
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 2px;
    transition: background 0.12s, color 0.12s;
  }
  .header-tab-new:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }

  .header-ctx {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    padding: 2px 8px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
  .fake-btn { width: 26px; height: 26px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle); }

  .body-note { padding: 40px; color: var(--text-dim); font-size: 13px; line-height: 2; }
  .body-note code { color: var(--gold-400); }
</style>
</head>
<body>
  <header id="header">
    <div class="header-left">
      <div class="fake-btn"></div>
      <div style="width:97px;height:18px;border-radius:4px;background:rgba(255,255,255,0.12)"></div>
    </div>

    <div class="header-center">
      <div class="header-tabs">
        <div class="header-tabs-scroll">
          <div class="header-tab" title="切换到 default">
            <span class="header-tab-title">default</span>
            <button class="header-tab-close" title="关闭标签页"><svg width="9" height="9" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          </div>
          <div class="header-tab" title="切换到 2026-08-01-22-31">
            <span class="header-tab-title">2026-08-01-22-31</span>
            <button class="header-tab-close" title="关闭标签页"><svg width="9" height="9" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          </div>
          <div class="header-tab active" title="切换到 manager-协作面板">
            <span class="header-tab-title">manager-协作面板</span>
            <button class="header-tab-close" title="关闭标签页"><svg width="9" height="9" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          </div>
          <div class="header-tab" title="切换到 browser-调研">
            <span class="header-tab-title">browser-调研</span>
            <button class="header-tab-close" title="关闭标签页"><svg width="9" height="9" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          </div>
          <button class="header-tab-new" title="新建标签页"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
      </div>
    </div>

    <div class="header-right">
      <div class="fake-btn"></div>
      <span class="header-ctx" title="上下文长度">ctx: 1234t</span>
      <div class="fake-btn"></div>
      <span class="status-dot" title="connected"></span>
      <div class="fake-btn"></div>
      <div class="fake-btn"></div>
      <div class="fake-btn"></div>
    </div>
  </header>

  <div class="body-note">
    <p>标签页视觉预览（深色主题）：</p>
    <p>· 当前活动标签 <code>manager-协作面板</code> 金色高亮，其余为次级灰</p>
    <p>· 每个标签有 <code>×</code> 关闭按钮（hover 变红），末尾 <code>+</code> 新建</p>
    <p>· 标签过多时横向滚动（滚动条隐藏），标题超长省略号截断</p>
  </div>
</body>
</html>
