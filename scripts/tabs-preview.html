<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>标题栏标签页预览</title>
<style>
  :root {
    --bg-base: #141110;
    --bg-deepest: #0d0b0a;
    --text-primary: #f3efe6;
    --text-muted: #a89f92;
    --text-dim: #6f675c;
    --border-subtle: rgba(255, 255, 255, 0.06);
    --gold-300: #E5D08A;
    --gold-400: #D4B86A;
    --danger: #ef4444;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
    --header-height: 48px;
    --font-mono: 'Cascadia Code', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: var(--bg-deepest); color: var(--text-primary); }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--header-height);
    padding: 0 var(--space-4);
    background: rgba(21, 18, 16, 0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
    position: relative;
  }
  #header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 168, 67, 0.25), transparent);
  }
  .header-left { display: flex; align-items: center; gap: 4px; }
  .header-right { display: flex; align-items: center; gap: var(--space-3); }

  .header-center {
    flex: 1;
    height: 100%;
    min-width: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 var(--space-2);
  }
  .header-tabs {
    display: flex;
    align-items: flex-end;
    width: 100%;
    max-width: 760px;
    overflow: hidden;
    height: 100%;
  }
  .header-tabs-scroll {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    flex: 1;
    height: 100%;
  }
  .header-tabs-scroll::-webkit-scrollbar { display: none; }
  .header-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px 0 14px;
    border-radius: 10px 10px 0 0;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid transparent;
    border-bottom: none;
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    max-width: 200px;
    min-width: 60px;
    position: relative;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .header-tab:hover { background: rgba(255, 255, 255, 0.06); color: var(--text-primary); }
  .header-tab.active {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(212, 168, 67, 0.35);
    color: var(--gold-300);
  }
  .header-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 2px;
    background: var(--gold-400);
    border-radius: 2px 2px 0 0;
  }
  .header-tab-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-tab-close {
    display: flex; align-items: center; justify-content: center;
    width: 16px; height: 16px;
    border: none; border-radius: 4px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: background 0.12s, color 0.12s;
  }
  .header-tab-close:hover { background: rgba(239, 68, 68, 0.18); color: var(--danger); }
  .header-tab-new {
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 2px;
    transition: background 0.12s, color 0.12s;
  }
  .header-tab-new:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }

  .header-ctx {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    padding: 2px 8px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
  .fake-btn { width: 26px; height: 26px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle); }

  /* 亮色主题 */
  html[data-theme='light'] { background: #f5f5f4; }
  html[data-theme='light'] #header {
    background: rgba(255, 255, 255, 0.88);
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }
  html[data-theme='light'] #header::after {
    background: linear-gradient(90deg, transparent, rgba(57, 100, 254, 0.2), transparent);
  }
  html[data-theme='light'] .header-tab {
    background: rgba(0, 0, 0, 0.03);
    border-color: rgba(0, 0, 0, 0.08);
    color: #555;
  }
  html[data-theme='light'] .header-tab:hover { background: rgba(0, 0, 0, 0.05); color: #1a1a2e; }
  html[data-theme='light'] .header-tab.active {
    background: #ffffff;
    border-color: rgba(57, 100, 254, 0.3);
    color: #1a1a2e;
  }
  html[data-theme='light'] .header-tab.active::after { background: #3964fe; }
  html[data-theme='light'] .header-tab-new:hover { background: rgba(0, 0, 0, 0.05); }
  html[data-theme='light'] .header-ctx { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08); color: #777; }
  html[data-theme='light'] .fake-btn { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08); }

  .controls { padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
  .controls button {
    padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border-subtle);
    background: rgba(255,255,255,0.05); color: var(--text-muted); cursor: pointer; font-size: 12px;
  }
  .controls button:hover { color: var(--text-primary); }
  .body-note { padding: 0 40px; color: var(--text-dim); font-size: 13px; line-height: 2; }
  .body-note code { color: var(--gold-400); }
  html[data-theme='light'] .body-note code { color: #3964fe; }
</style>
</head>
<body>
  <header id="header">
    <div class="header-left">
      <div class="fake-btn"></div>
      <div style="width:97px;height:18px;border-radius:4px;background:rgba(255,255,255,0.12)"></div>
    </div>

    <div class="header-center">
      <div class="header-tabs">
        <div class="header-tabs-scroll">
          <div class="header-tab" title="切换到 default">
            <span class="header-tab-title">default</span>
            <button class="header-tab-close" title="关闭标签页"><svg width="9" height="9" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          </div>
          <div class="header-tab" title="切换到 2026-08-01-22-31">
            <span class="header-tab-title">2026-08-01-22-31</span>
            <button class="header-tab-close" title="关闭标签页"><svg width="9" height="9" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          </div>
          <div class="header-tab active" title="切换到 manager-协作面板">
            <span class="header-tab-title">manager-协作面板</span>
            <button class="header-tab-close" title="关闭标签页"><svg width="9" height="9" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          </div>
          <div class="header-tab" title="切换到 browser-调研">
            <span class="header-tab-title">browser-调研</span>
            <button class="header-tab-close" title="关闭标签页"><svg width="9" height="9" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          </div>
          <button class="header-tab-new" title="新建标签页"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
      </div>
    </div>

    <div class="header-right">
      <div class="fake-btn"></div>
      <span class="header-ctx" title="上下文长度">ctx: 1234t</span>
      <div class="fake-btn"></div>
      <span class="status-dot" title="connected"></span>
      <div class="fake-btn"></div>
      <div class="fake-btn"></div>
      <div class="fake-btn"></div>
    </div>
  </header>

  <div class="controls">
    <button id="theme-toggle">切换到亮色 / 暗色</button>
    <button id="scroll-demo">演示滚动（滚到最右）</button>
  </div>

  <div class="body-note">
    <p>浏览器风格标签页（参考图样式）：</p>
    <p>· 形状：<code>顶部大圆角 + 底部直角</code>，贴住标题栏底边，像从内容区“长出”</p>
    <p>· 活动标签：深色下金色高亮 + <code>底部金色高亮条</code>；亮色下纯白背景 + <code>蓝色高亮条</code>（同参考图）</p>
    <p>· 非活动标签：半透明底，hover 微亮</p>
  </div>

<script>
  const tabs = Array.from(document.querySelectorAll('.header-tab'));
  const scrollBox = document.querySelector('.header-tabs-scroll');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    });
  });
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme;
    document.documentElement.dataset.theme = cur === 'light' ? 'dark' : 'light';
  });
  document.getElementById('scroll-demo').addEventListener('click', () => {
    scrollBox.scrollLeft = scrollBox.scrollWidth;
  });
</script>
</body>
</html>
